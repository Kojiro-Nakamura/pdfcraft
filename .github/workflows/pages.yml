# Build the WebAssembly app (apps/pdfcraft-web) with Trunk and deploy it to GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: 0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: storytold/craft-common-actions/actions/checkout-craft-fonts@main
        with:
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: pages-wasm
      - uses: storytold/craft-common-actions/actions/install-trunk@main
        with:
          trunk-version: "0.21.14"
      - name: Verify asset policy
        run: cargo run --locked -q -p xtask -- assets
      - name: Build web app
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: "1"
        run: |
          packaging/web/package.sh
          cp README.md LICENSE-MIT LICENSE-APACHE NOTICE ATTRIBUTION.md dist/web/
          for f in "$CRAFT_FONTS_DIR"/fonts/*/OFL.txt; do
            [ -f "$f" ] || continue
            family="$(basename "$(dirname "$f")")"
            cp "$f" "dist/web/OFL-$family.txt"
          done
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
